<svg xmlns="http://www.w3.org/2000/svg" id="ambient" viewBox="0 0 600 600" preserveAspectRatio="xMidYMid slice">
  <title>Iceland, Puffin Colony</title>
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#9baeb2"/>
      <stop offset="1" stop-color="#d5ccc0"/>
    </linearGradient>
    <pattern id="paper" width="4" height="4" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".53" fill="#43565a" opacity=".16"/>
    </pattern>
    <linearGradient id="sea" x2="0" y2="1">
      <stop stop-color="#819e9d"/>
      <stop offset="1" stop-color="#576e72"/>
    </linearGradient>
    <g id="puffin">
      <path d="M-24 4q1-11 12-17 8-9 16-9 12 0 15 15 3 12-8 17-18 6-37 0l-14 3 13-9z" fill="#354850"/>
      <path d="M-11 10q8 3 17-1 7-5 6-15l7-1q4 13-6 18-10 6-23 3z" fill="#dedcc5"/>
      <path d="M-31 9q10-16 30-18Q-4 3-25 10z" fill="#485b60"/>
      <path d="M-24 7l16-10" fill="none" stroke="#8c9b94" stroke-width="0.9" opacity="0.65" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M-7 13l1 4-8 1 1 2 11-1-1-7zm12 0 2 4-4 2 9-1-4-2-1-4z" fill="#c5835e"/>
      <g class="head">
        <path d="M-1 0q-2-15 7-21 9-7 17 1l3 6-1 12-8 5-14-1z" fill="#354850"/>
        <path d="M4-13q2-8 10-8 9 0 11 9l-3 9-9 4-9-5z" fill="#e5e0c9"/>
        <path d="M22-14l8 1 9 8-16 1-4-4z" fill="#d49368"/>
        <path d="M29-12l2 7 8 0-6-6z" fill="#bc7053"/>
        <path d="M25-12l2 7" fill="none" stroke="#e8bc87" stroke-width="1.5" opacity="1" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M10-13l4-2 3 3-3 3-2-2z" fill="#677578"/>
        <circle cx="14" cy="-12" r="1.6" fill="#273d43" opacity="1"/>
      </g>
    </g>
    <g id="fly">
      <path d="M-5 0q3-2 7-1l4 1-4 2-5-1-6 1z" fill="#53696b"/>
      <path class="wing" d="M-1 0q-5-5-10-7 7 0 13 6l9-5-7 7z" fill="#41585c"/>
    </g>
  </defs>
  <style>
    @media (prefers-reduced-motion: no-preference) {
      :target .head {animation: listen 8.4s ease-in-out var(--delay,-1s) infinite alternate;}
      :target .flight {animation: crossing 26s linear -9s infinite;}
      :target .wing {animation: wingbeat 1.9s ease-in-out -.5s infinite alternate;}
    }
    @keyframes listen {0%,28%{transform:rotate(-3deg)} 78%,100%{transform:rotate(4deg)}}
    @keyframes crossing {0%{opacity:0;transform:translate(-62px,10px)} 14%,83%{opacity:.8} 100%{opacity:0;transform:translate(74px,-8px)}}
    @keyframes wingbeat {from{transform:scaleY(.30)} to{transform:scaleY(1)}}
  </style>
  <rect width="600" height="600" fill="url(#sky)"/>
  <circle cx="405" cy="166" r="34" fill="#eadfc4" opacity="0.59"/>
  <path d="M0 248l25-8 26-2 29-6 23 3 18 8 28 6zM455 252l27-9 38-5 23-12 30-1 27-8v44z" fill="#86999b"/>
  <rect x="0" y="254" width="600" height="346" fill="url(#sea)"/>
  <path d="M14 262h72m57-4h48m200 1h32m105 5h51M390 285l48-1m-24 8 28-1m-274 7 55-1" fill="none" stroke="#d1d1b9" stroke-width="1.3" opacity="0.58" stroke-linecap="round" stroke-linejoin="round"/>
  <g class="flight">
    <use href="#fly" transform="translate(207 243) scale(0.71 0.71)"/>
    <use href="#fly" transform="translate(233 235) scale(0.65 0.65)"/>
    <use href="#fly" transform="translate(260 247) scale(0.72 0.72)"/>
    <use href="#fly" transform="translate(278 231) scale(0.55 0.55)"/>
    <use href="#fly" transform="translate(306 241) scale(0.6 0.6)"/>
    <use href="#fly" transform="translate(332 226) scale(0.52 0.52)"/>
    <use href="#fly" transform="translate(355 233) scale(0.55 0.55)"/>
  </g>
  <path d="M600 303l-47 5-20 9-36-2-38 9-13 17-33 4-27 22-14 43 228-17z" fill="#657977"/>
  <path d="M-5 332l83 8 62 21 45-1 43-11 47 2 30-9 38 6 22-10 27 4 13 18-12 21-27 7-15 29-17 4-13 31-41 29-8 32-39 19-21 51H-5z" fill="#495b5d"/>
  <path d="M0 326l80 10 69 20 38-1 40-13 50 3 28-10 37 6 18-9 27 4 17 14-52-1-35 10-35-5-41 10-46 4-60 12-71-14L0 360z" fill="#879176"/>
  <path d="M40 347l27 3m131 11 24-6m91-9 15 1m27-6 9-2" fill="none" stroke="#c2bb91" stroke-width="1.7" opacity="1" stroke-linecap="round" stroke-linejoin="round"/>
  <g>
    <use href="#puffin" transform="translate(232 347) scale(0.94 0.94)"/>
  </g>
  <g style="--delay:-4s">
    <use href="#puffin" transform="translate(296 339) scale(-0.8 0.8)"/>
  </g>
  <g style="--delay:-7s">
    <use href="#puffin" transform="translate(354 335) scale(0.61 0.61)"/>
  </g>
  <g style="--delay:-3s">
    <use href="#puffin" transform="translate(164 358) scale(0.59 0.59)"/>
  </g>
  <path d="M13 378l17 6 13 41-12-8zm104 17 9 29-4 29-7-35zm125-5-13 58-8 6 12-55zm71-13-9 35-15 13 14-44zm45-12-7 18-12 10 8-23z" fill="#71817c" opacity=".68"/>
  <path d="M443 424l18-14 18-2 13-6 29 8 10 15-45 8z" fill="#54696a"/>
  <path d="M390 425q24-6 41-2m102 7 38-4" fill="none" stroke="#aab9aa" stroke-width="1.3" opacity="0.64" stroke-linecap="round" stroke-linejoin="round"/>
  <rect width="600" height="600" fill="url(#paper)"/>
</svg>
