    }
    @keyframes cloth { from{transform:skewX(-2deg) scaleY(.98)} to{transform:skewX(6deg) scaleY(1.03)} }
    @keyframes sun { from{opacity:.52;transform:translateX(-6px)} to{opacity:.95;transform:translateX(6px)} }
