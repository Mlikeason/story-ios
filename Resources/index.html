<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17221e">
  <title>Story · Field recordings</title>
  <link rel="icon" href="icon.png">
  <link rel="stylesheet" href="player.css">
  <script defer src="player.js"></script>
</head>
<body>
  <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="play" viewBox="0 0 24 24"><path fill="currentColor" stroke="none" d="M7 4.6q0-1.6 1.4-.8l12 7.4q1.3.8 0 1.6l-12 7.4q-1.4.8-1.4-.8z"/></symbol>
    <symbol id="pause" viewBox="0 0 24 24"><path stroke-width="4" d="M8 5v14m8-14v14"/></symbol>
    <symbol id="left" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></symbol>
    <symbol id="right" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
    <symbol id="library" viewBox="0 0 24 24"><path d="M4 5v14m5-14v14m4-14 5 14"/></symbol>
    <symbol id="controls" viewBox="0 0 24 24"><path d="M3 7h6m6 0h6M3 17h11m6 0h1"/><circle cx="12" cy="7" r="3"/><circle cx="17" cy="17" r="3"/></symbol>
    <symbol id="solo" viewBox="0 0 24 24"><rect x="2.5" y="4" width="19" height="16" rx="3"/></symbol>
    <symbol id="split" viewBox="0 0 24 24"><rect x="2.5" y="4" width="19" height="16" rx="3"/><path d="M13 4v16m3-11h3m-3 4h3"/></symbol>
    <symbol id="list" viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.1M4 12h.1M4 18h.1"/></symbol>
    <symbol id="stack" viewBox="0 0 24 24"><rect x="4" y="2.5" width="16" height="19" rx="3"/><path d="M4 12h16m-12 3h8m-8 3h5"/></symbol>
    <symbol id="heart" viewBox="0 0 24 24"><path d="M12 20S2.5 14.2 2.5 8.2C2.5 3.6 9 2 12 7c3-5 9.5-3.4 9.5 1.2C21.5 14.2 12 20 12 20z"/></symbol>
    <symbol id="loop" viewBox="0 0 24 24"><path d="M12 12C9 7 7.6 6 5.7 6a6 6 0 0 0 0 12c2.2 0 4.1-2.5 6.3-6s4.1-6 6.3-6a6 6 0 0 1 0 12c-1.9 0-3.3-1-6.3-6z" transform="translate(2 2) scale(.83)"/></symbol>
    <symbol id="close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
  </svg>
  <main id="desk">
    <section id="player" aria-labelledby="title">
      <div class="landscape" aria-hidden="true"></div>
      <div class="player-scroll">
        <header class="mast">
          <span class="brand" lang="en">Story<span>.</span></span>
          <span class="imprint" lang="en">The Unbearable<br> Lightness of Being</span>
          <button id="open-library" class="glass" aria-controls="archive"><svg><use href="#library"/></svg><span data-label="library"></span></button>
        </header>
        <div class="listening">
          <div class="caption">
            <div class="eyebrow"><span class="line"></span><span id="number"></span></div>
            <div class="title-line"><h1 id="title"></h1><button id="favorite" aria-pressed="false"><svg aria-hidden="true"><use href="#heart"/></svg></button></div>
            <p id="location"></p>
          </div>
          <div class="deck">
            <svg id="wave" viewBox="0 0 240 52" preserveAspectRatio="none" aria-hidden="true"></svg>
            <div class="transport">
              <button id="previous" class="round ghost"><svg><use href="#left"/></svg></button>
              <button id="toggle" class="round primary"><svg><use href="#play"/></svg></button>
              <button id="next" class="round ghost"><svg><use href="#right"/></svg></button>
            </div>
          </div>
        </div>
        <div role="alert" id="error" hidden></div>
      </div>
    </section>
    <aside id="archive" aria-labelledby="archive-title">
      <div class="archive-head">
        <div class="eyebrow" lang="en">FIELD INDEX <span class="line"></span></div>
        <h2 id="archive-title" data-label="library"></h2>
        <button class="round ghost" id="close-library"><svg><use href="#close"/></svg></button>
      </div>
      <nav class="recordings"></nav>
      <footer class="support-links">
        <button class="write-link" data-support="thought" data-label="write"></button>
        <div class="secondary-links"><button data-support="problem" data-label="report"></button><button data-support="help" data-label="help"></button><button data-about data-label="about"></button><button id="library-privacy" data-label="privacy"></button></div>
      </footer>
    </aside>
    <div class="status-tools">
      <button id="mode" data-minutes="0">
        <svg class="loop-symbol" aria-hidden="true"><use href="#loop"/></svg>
        <span aria-hidden="true"></span>
      </button>
      <div class="view-picker" role="group" aria-label="Player layout">
        <button id="view-solo" aria-pressed="true"><svg><use href="#solo"/></svg></button>
        <button id="view-split" aria-pressed="false"><svg aria-hidden="true"><use class="split-horizontal" href="#split"/><use class="split-vertical" href="#stack"/><use class="cover-list" href="#list"/></svg></button>
      </div>
      <button id="open-settings" aria-haspopup="dialog"><svg><use href="#controls"/></svg></button>
    </div>
  </main>
  <dialog id="settings" aria-labelledby="settings-title">
    <header><h2 id="settings-title" data-label="settings"></h2><button id="close-settings" class="round ghost"><svg><use href="#close"/></svg></button></header>
    <fieldset><legend data-label="language"></legend>
      <label><input type="radio" name="language" value="en"> <span lang="en">English</span></label>
      <label><input type="radio" name="language" value="zh"> <span lang="zh-Hans">简体中文</span></label>
    </fieldset>
    <footer class="support-links">
      <button class="write-link" data-support="thought" data-label="write"></button>
      <div class="secondary-links"><button data-support="problem" data-label="report"></button><button data-support="help" data-label="help"></button><button data-about data-label="about"></button><button id="privacy" data-label="privacy"></button></div>
    </footer>
  </dialog>
  <dialog id="support" aria-labelledby="support-title"><header><strong id="support-title" data-label="support"></strong><button id="close-support" class="round ghost"><svg><use href="#close"/></svg></button></header><iframe title="Help & feedback"></iframe></dialog>
  <dialog id="about" aria-labelledby="about-title"><header><strong id="about-title" data-label="about"></strong><button id="close-about" class="round ghost"><svg><use href="#close"/></svg></button></header><iframe title="About Story"></iframe></dialog>
  <dialog id="policy" aria-labelledby="policy-title"><header><strong id="policy-title" data-label="privacy"></strong><button id="close-policy" class="round ghost"><svg><use href="#close"/></svg></button></header><iframe title="Privacy policy"></iframe></dialog>
</body>
</html>
