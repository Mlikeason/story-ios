  <style>
    .drop, .ripple { opacity: 0; }
    @media (prefers-reduced-motion: no-preference) {
      #ambient:target .drop { animation: fall var(--cycle) linear var(--offset) infinite; }
      #ambient:target .ripple { animation: land var(--cycle) ease-out var(--offset) infinite; }
    }
    @keyframes fall {
      0% { transform: translateY(var(--start)); opacity: 0; }
      13% { opacity: .52; }
      67% { transform: translateY(0); opacity: .52; }
      68%, 100% { transform: translateY(0); opacity: 0; }
    }
    @keyframes land {
      0%, 66% { transform: scale(.18); opacity: 0; }
      69% { opacity: .57; }
      97%, 100% { transform: scale(1); opacity: 0; }
    }
  </style>
