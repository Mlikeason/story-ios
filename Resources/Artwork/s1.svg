  <style>
    .sway { transform-origin: 0 0; }
    .embers { opacity: .72; }
    @media (prefers-reduced-motion: no-preference) {
      :target .sway { animation: breeze var(--period) ease-in-out var(--phase) infinite alternate; }
      :target .embers { animation: breathe 6.8s ease-in-out -1.4s infinite alternate; }
      :target .flame { transform-origin: 0 0; animation: kindle 5.1s ease-in-out -2s infinite alternate; }
    }
    @keyframes breeze { from { transform: skewX(-.8deg); } to { transform: skewX(1.2deg); } }
    @keyframes breathe { from { opacity: .46; } to { opacity: .93; } }
    @keyframes kindle { from { transform: scale(.94,.84); } to { transform: scale(1.04,1.06); } }
  </style>
